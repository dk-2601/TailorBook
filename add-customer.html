<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Customer</title>
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <a class="back-link" href="index.html">Home</a>
      <h1>Add Customer</h1>

      <section class="section">
        <form id="customerForm">
          <div>
            <label for="customerName">Name</label>
            <input id="customerName" type="text" placeholder="Customer name" required />
          </div>

          <div>
            <label for="customerPhone">Phone</label>
            <input id="customerPhone" type="tel" placeholder="Phone number" required />
          </div>

          <div>
            <label for="customerNotes">Notes</label>
            <textarea id="customerNotes" placeholder="Measurements / remarks"></textarea>
          </div>

          <button type="submit">Save Customer</button>
          <p id="customerMessage" class="message"></p>
        </form>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="js/cloud-config.js"></script>
    <script src="js/firestore-sync.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/customers.js"></script>
      <script src="js/pwa.js"></script>
  </body>
</html>
