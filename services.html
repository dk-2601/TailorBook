<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <meta name="theme-color" content="#c23a73" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <a class="back-link" href="index.html">Back</a>
      <h1>Services</h1>

      <section class="section">
        <h2 id="serviceFormTitle">Add Service</h2>
        <form id="serviceForm" class="field-form">
          <input id="serviceId" type="hidden" />
          <div class="field-item">
            <label for="serviceName">Service Name</label>
            <input id="serviceName" type="text" placeholder="Blouse Stitching" required />
          </div>
          <div class="field-item">
            <label for="servicePrice">Default Price</label>
            <input id="servicePrice" type="number" min="0" placeholder="0" required />
          </div>
          <div class="save-bar">
            <button type="submit" class="ok-btn" id="saveServiceBtn">Save Service</button>
            <button type="button" class="mini-btn hidden" id="cancelServiceEditBtn">Cancel</button>
          </div>
          <p id="serviceMessage" class="message"></p>
        </form>
      </section>

      <section class="section">
        <h2>Service List</h2>
        <input id="serviceSearch" type="text" placeholder="Search services" />
        <div id="serviceList" class="list-box"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="js/cloud-config.js"></script>
    <script src="js/firestore-sync.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app-config.js"></script>
    <script src="js/loading-screen.js"></script>
    <script src="js/services.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
