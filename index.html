<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailor Book</title>
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <div class="top-bar">
        <h1>Tailor Book</h1>
        <div class="top-actions">
          <a href="services.html" class="mini-link" id="manageServicesBtn">Services</a>
          <button id="signOutBtn" type="button" class="mini-btn hidden">Sign out</button>
        </div>
      </div>

      <p id="welcomeText" class="welcome-text">Welcome</p>

      <section class="tab-panel active" id="tab-overview">
        <section class="section" id="dashboardFixedSection">
          <h2>Overview</h2>
          <div id="fixedMetricsGrid" class="grid dashboard-grid"></div>
        </section>

        <section class="section" id="dashboardInsightsSection">
          <h2>Customer Highlights</h2>
          <div id="globalInsights" class="insight-grid"></div>
        </section>

        <section class="section" id="dashboardRangeSection">
          <h2>Range Metrics</h2>
          <div class="range-toolbar" id="rangeToolbar" role="group" aria-label="Date range filter">
            <button type="button" class="range-chip active" data-range="today">Today</button>
            <button type="button" class="range-chip" data-range="week">This Week</button>
            <button type="button" class="range-chip" data-range="month">This Month</button>
            <button type="button" class="range-chip" data-range="year">This Year</button>
            <button type="button" class="range-chip" data-range="custom">Custom Range</button>
          </div>

          <div id="customRangeWrap" class="custom-range hidden">
            <div class="custom-range-fields">
              <div class="field-item">
                <label for="rangeFrom">From</label>
                <input id="rangeFrom" type="date" />
              </div>
              <div class="field-item">
                <label for="rangeTo">To</label>
                <input id="rangeTo" type="date" />
              </div>
            </div>
            <button type="button" id="applyCustomRangeBtn" class="mini-btn">Apply</button>
          </div>

          <p id="rangeCaption" class="range-caption"></p>
          <div id="rangeMetricsGrid" class="grid dashboard-grid"></div>
        </section>
      </section>

      <section class="tab-panel" id="tab-customers">
        <section class="section">
          <h2>Customers</h2>
          <label for="customerSearch">Search Customer</label>
          <input id="customerSearch" type="text" placeholder="Search by name or phone" />
          <div id="customerList" class="list-box"></div>
        </section>
      </section>

      <section class="tab-panel" id="tab-orders">
        <section class="section">
          <h2>Orders</h2>
          <label for="statusFilter">Filter by Status</label>
          <select id="statusFilter">
            <option value="All">All</option>
            <option value="Pending">Pending</option>
            <option value="Stitching">Stitching</option>
            <option value="Ready">Ready</option>
            <option value="Delivered">Delivered</option>
          </select>
          <div id="ordersContainer"></div>
        </section>
      </section>
    </main>

    <nav class="footer-nav" aria-label="Main tabs">
      <button class="footer-tab active" data-tab="overview" type="button">
        <span class="tab-icon">⌂</span>
        <span class="tab-text">Overview</span>
      </button>
      <button class="footer-tab" data-tab="customers" type="button">
        <span class="tab-icon">◉</span>
        <span class="tab-text">Customers</span>
      </button>
      <button class="footer-tab" data-tab="orders" type="button">
        <span class="tab-icon">▣</span>
        <span class="tab-text">Orders</span>
      </button>
    </nav>

    <button id="fabCustomer" type="button" class="fab fab-customer" aria-label="Add customer">+ Customer</button>
    <button id="fabOrder" type="button" class="fab fab-order hidden" aria-label="Add order">+ Order</button>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="js/cloud-config.js"></script>
    <script src="js/firestore-sync.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/home.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
