<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailorBook</title>
    <meta name="theme-color" content="#c23a73" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <div class="top-bar">
        <h1>TailorBook</h1>
        <div class="top-actions">
          <a href="services.html" class="icon-action-link" id="manageServicesBtn" aria-label="Open services">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 18.5h17"></path>
              <path d="M6 18.5V16c0-1.9 1.6-3.5 3.5-3.5H13c2.7 0 4.5-1.8 4.5-4.5V6.8c0-2.2 1.8-4 4-4"></path>
              <path d="M9 9h3"></path>
              <path d="M16 9h4"></path>
              <path d="M19.5 9v4.3"></path>
              <circle cx="19" cy="14.7" r="2.1"></circle>
              <path d="M17 17.2h-5.1c-1.4 0-2.6 1.2-2.6 2.6v0.7"></path>
            </svg>
          </a>
          <button id="signOutBtn" type="button" class="icon-menu-btn hidden" aria-label="Sign out">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.2"></circle>
              <path d="M5 19c.8-3.2 3.5-5 7-5s6.2 1.8 7 5"></path>
            </svg>
          </button>
        </div>
      </div>

      <p id="welcomeText" class="welcome-text">Welcome</p>

      <section class="tab-panel active" id="tab-overview">
        <section class="section" id="dashboardFixedSection">
          <h2>Overview</h2>
          <div id="fixedMetricsGrid" class="grid dashboard-grid"></div>
        </section>

        <section class="section" id="upcomingDeliveriesSection">
          <h2>Upcoming Deliveries</h2>
          <div id="upcomingDeliveries" class="delivery-list"></div>
        </section>

        <section class="section" id="dashboardInsightsSection">
          <h2>Customer Highlights</h2>
          <div id="globalInsights" class="insight-grid"></div>
        </section>

        <section class="section" id="dashboardRangeSection">
          <h2>Range Metrics</h2>
          <div class="range-toolbar" id="rangeToolbar" role="group" aria-label="Date range filter">
            <button type="button" class="range-chip active" data-range="today">Today</button>
            <button type="button" class="range-chip" data-range="week">This Week</button>
            <button type="button" class="range-chip" data-range="month">This Month</button>
            <button type="button" class="range-chip" data-range="year">This Year</button>
            <button type="button" class="range-chip" data-range="custom">Custom Range</button>
          </div>

          <div id="customRangeWrap" class="custom-range hidden">
            <div class="custom-range-fields">
              <div class="field-item">
                <label for="rangeFrom">From</label>
                <input id="rangeFrom" type="date" />
              </div>
              <div class="field-item">
                <label for="rangeTo">To</label>
                <input id="rangeTo" type="date" />
              </div>
            </div>
            <button type="button" id="applyCustomRangeBtn" class="mini-btn">Apply</button>
          </div>

          <p id="rangeCaption" class="range-caption"></p>
          <div id="rangeMetricsGrid" class="grid dashboard-grid"></div>
        </section>
      </section>

      <section class="tab-panel" id="tab-customers">
        <section class="section">
          <h2>Customers</h2>
          <label for="customerSearch">Search Customer</label>
          <input id="customerSearch" type="text" placeholder="Search by name or phone" />
          <div id="customerList" class="list-box"></div>
        </section>
      </section>

      <section class="tab-panel" id="tab-orders">
        <section class="section">
          <h2>Orders</h2>
          <label for="statusFilter">Filter by Status</label>
          <select id="statusFilter">
            <option value="All">All</option>
            <option value="Pending">Pending</option>
            <option value="Stitching">Stitching</option>
            <option value="Ready">Ready</option>
            <option value="Delivered">Delivered</option>
          </select>
          <div id="ordersContainer"></div>
        </section>
      </section>
    </main>

    <nav class="footer-nav" aria-label="Main tabs">
      <button class="footer-tab active" data-tab="overview" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M6.5 9.5V20h11V9.5"></path>
          </svg>
        </span>
        <span class="tab-text">Overview</span>
      </button>
      <button class="footer-tab" data-tab="customers" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="8.5" r="3"></circle>
            <circle cx="16.5" cy="9.5" r="2.5"></circle>
            <path d="M3.5 19c.7-3 3.2-4.8 5.5-4.8 2.3 0 4.8 1.8 5.5 4.8"></path>
            <path d="M13.2 19c.4-1.9 1.9-3.4 3.8-3.8 1.7-.4 3.2.4 3.9 1.3"></path>
          </svg>
        </span>
        <span class="tab-text">Customers</span>
      </button>
      <button class="footer-tab" data-tab="orders" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3.5 7.5 12 3l8.5 4.5L12 12 3.5 7.5Z"></path>
            <path d="M3.5 7.5V16.5L12 21l8.5-4.5V7.5"></path>
            <path d="M12 12v9"></path>
          </svg>
        </span>
        <span class="tab-text">Orders</span>
      </button>
    </nav>

    <button id="fabCustomer" type="button" class="fab fab-customer" aria-label="Add customer">+ Customer</button>
    <button id="fabOrder" type="button" class="fab fab-order hidden" aria-label="Add order">+ Order</button>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="js/cloud-config.js"></script>
    <script src="js/firestore-sync.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app-config.js"></script>
    <script src="js/loading-screen.js"></script>
    <script src="js/home.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
